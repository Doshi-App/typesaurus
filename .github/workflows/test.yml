# Per ADR 0002 (docs/adr/0002-peer-dependency-strategy.md): verify the declared
# peer-dependency range against the floor and latest of each supported Firebase
# major. Five jobs: 3 admin (firebase-admin majors 12/13/14...) + 2 admin floor,
# plus 1 type-check job. Browser/web-adapter matrix is deferred until we wire
# Playwright in CI; for rc.0 the admin matrix is the load-bearing one because
# Doshi's server is the lead consumer (see ADR 0001 § Dogfooding plan).

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: type-check (typescript@6, latest firebase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: make types

  test-admin:
    name: test-admin (firebase-admin@${{ matrix.firebase-admin }})
    runs-on: ubuntu-latest
    needs: type-check
    strategy:
      fail-fast: false
      matrix:
        firebase-admin:
          - "12.7.0"   # floor: first minor with vector-search APIs
          - "^13"      # latest of v13 major

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - name: Override firebase-admin to ${{ matrix.firebase-admin }}
        run: pnpm add -D "firebase-admin@${{ matrix.firebase-admin }}"

      - name: Materialize emulator config
        run: cp .firebaserc.example .firebaserc

      - run: make test-node

  # Web/browser matrix is deferred to a follow-up. The blockers:
  #   1. Upstream pins Playwright @ 1.40, which doesn't know about Ubuntu
  #      24.04's libasound2 → libasound2t64 rename. ADR 0002 deliberately
  #      did NOT bump Playwright in rc.0.
  #   2. vitest@3's browser-mode API differs from 1.x and likely needs
  #      config-side migration before browser tests run cleanly.
  # rc.0 ships with admin matrix + type-check only. The admin matrix is
  # the load-bearing one for Doshi server (the lead consumer per ADR 0001
  # § Dogfooding plan). Web matrix lands in a separate issue.
