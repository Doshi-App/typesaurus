# Publish @doshi/typesaurus to npm when a release tag is pushed.
#
# Trigger: pushing a tag matching `v*` (e.g. `v11.0.0-rc.2`, `v11.0.0`).
# The tag is the release intent; package.json must already hold the matching
# version. The workflow refuses to publish if tag and package.json disagree.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret is stored anywhere
# in this repo. npm verifies on each publish that the OIDC token's claim chain
# matches the trusted publisher configured on the @doshi/typesaurus package
# settings (org Doshi-App, repo typesaurus, workflow release.yml).
#
# Dist-tag selection:
#   - Versions containing a pre-release suffix (`-rc.N`, `-beta.N`, ...) → `next`
#   - Everything else → `latest`

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` is required for npm Trusted Publishing (OIDC).
      id-token: write
      # `contents: write` is required to create the GitHub Release entry.
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          # `--generate-notes` walks back to the previous tag — needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$tag_version) does not match package.json version $pkg_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Determine dist-tag
        id: dist_tag
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: make build

      - name: Publish to npm
        working-directory: lib
        env:
          # Belt-and-braces: pnpm honours --provenance, but the env var is the
          # canonical knob for the underlying npm CLI.
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pnpm publish \
            --access public \
            --no-git-checks \
            --tag "${{ steps.dist_tag.outputs.tag }}" \
            --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          extra=()
          if [ "${{ steps.dist_tag.outputs.tag }}" = "next" ]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${extra[@]}"
